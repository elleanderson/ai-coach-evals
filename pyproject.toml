[project]
name = "ai-coach-evals"
version = "0.1.0"
description = "A readable eval kit for AI coaches: plain-English promises, realistic conversations and automated checks."
authors = [{ name = "Elle Anderson" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://andersonco.uk"
Source = "https://github.com/elleanderson/ai-coach-evals"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
